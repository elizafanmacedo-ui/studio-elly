<!DOCTYPE html>

<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Studio Elly Designer – Agenda</title>
<link href="./studio-elly-agendamento_files/css2" rel="stylesheet">
<style>
  :root {
    --rose: #c97d7d;
    --rose-light: #e8c4c4;
    --rose-dark: #8b4a4a;
    --cream: #faf6f2;
    --gold: #c9a96e;
    --gold-light: #f0e4cc;
    --dark: #2a1f1f;
    --mid: #6b5555;
    --light: #f5ede8;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(42,31,31,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--dark) 0%, var(--rose-dark) 100%);
    color: white;
    padding: 18px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(42,31,31,0.25);
  }
  .header-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.03em; line-height: 1.2; }
  .header-logo span { display: block; font-size: 0.72rem; font-family: 'DM Sans', sans-serif; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  .header-user { font-size: 0.8rem; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 6px 14px; cursor: pointer; transition: background 0.2s; }
  .header-user:hover { background: rgba(255,255,255,0.2); }

  /* ── NAV ── */
  .nav {
    display: flex; background: var(--white); border-bottom: 1px solid var(--rose-light);
    position: sticky; top: 64px; z-index: 90; overflow-x: auto;
  }
  .nav-btn {
    flex: 1; min-width: 80px; padding: 14px 8px 12px; font-size: 0.72rem; font-weight: 500;
    text-align: center; border: none; background: none; cursor: pointer; color: var(--mid);
    border-bottom: 3px solid transparent; transition: all 0.2s; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .nav-btn.active { color: var(--rose-dark); border-bottom-color: var(--rose); }
  .nav-btn .nav-icon { font-size: 1.2rem; display: block; margin-bottom: 3px; }

  /* ── PAGES ── */
  .page { display: none; padding: 20px 16px 100px; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--white); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--rose-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 12px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em;
  }
  .btn-primary { background: linear-gradient(135deg, var(--rose-dark), var(--rose)); color: white; box-shadow: 0 3px 12px rgba(201,125,125,0.35); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(201,125,125,0.45); }
  .btn-gold { background: linear-gradient(135deg, var(--gold), #e8c77a); color: var(--dark); }
  .btn-ghost { background: var(--light); color: var(--rose-dark); }
  .btn-danger { background: #ffe0e0; color: #c0392b; }
  .btn-sm { padding: 7px 14px; font-size: 0.78rem; }
  .btn-full { width: 100%; justify-content: center; }

  /* ── FORM ── */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--mid); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--rose-light);
    border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    background: var(--cream); color: var(--dark); outline: none; transition: border 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--rose); background: white; }
  textarea { resize: vertical; min-height: 80px; }

  /* ── AGENDA CALENDAR ── */
  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .date-nav-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--light); color: var(--rose-dark); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .date-label { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 600; color: var(--dark); }

  .week-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
  .week-scroll::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0; width: 52px; text-align: center; padding: 10px 0;
    border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
  }
  .day-chip .dc-name { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid); font-weight: 500; }
  .day-chip .dc-num { font-size: 1.2rem; font-weight: 600; color: var(--dark); margin-top: 2px; }
  .day-chip .dc-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rose); margin: 4px auto 0; opacity: 0; }
  .day-chip.has-event .dc-dot { opacity: 1; }
  .day-chip.selected { background: var(--rose-dark); border-color: var(--rose-dark); }
  .day-chip.selected .dc-name, .day-chip.selected .dc-num { color: white; }
  .day-chip.selected .dc-dot { background: white; }
  .day-chip:not(.selected):hover { border-color: var(--rose-light); background: var(--light); }

  /* colunas */
  .time-slot { display: flex; gap: 10px; margin-bottom: 6px; min-height: 48px; }
  .time-label { width: 44px; font-size: 0.7rem; color: var(--mid); text-align: right; flex-shrink: 0; padding-top: 4px; font-weight: 500; }
  .time-line { flex: 1; border-top: 1px dashed var(--rose-light); padding-top: 4px; position: relative; }
  .appt-block {
    background: linear-gradient(135deg, var(--rose-light), #f7dada);
    border-left: 3px solid var(--rose);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 4px; cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .appt-block:hover { box-shadow: 0 3px 12px rgba(201,125,125,0.3); }
  .appt-block.gold { background: linear-gradient(135deg, var(--gold-light), #f5e4c0); border-left-color: var(--gold); }
  .appt-block.green { background: #e8f5e9; border-left-color: #66bb6a; }
  .appt-name { font-weight: 600; font-size: 0.85rem; color: var(--dark); }
  .appt-detail { font-size: 0.75rem; color: var(--mid); margin-top: 1px; }
  .appt-prof { display: inline-block; font-size: 0.68rem; background: var(--rose-dark); color: white; border-radius: 10px; padding: 1px 7px; margin-top: 4px; }

  /* ── BADGES ── */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 500; }
  .badge-rose { background: var(--rose-light); color: var(--rose-dark); }
  .badge-gold { background: var(--gold-light); color: #7a5c1e; }
  .badge-green { background: #e8f5e9; color: #2e7d32; }

  /* ── LISTS ── */
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--light);
  }
  .list-item:last-child { border-bottom: none; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 700; color: white;
  }
  .av-rose { background: linear-gradient(135deg, var(--rose), var(--rose-dark)); }
  .av-gold { background: linear-gradient(135deg, var(--gold), #a0742e); }
  .av-green { background: linear-gradient(135deg, #66bb6a, #388e3c); }
  .list-info { flex: 1; min-width: 0; }
  .list-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-sub { font-size: 0.75rem; color: var(--mid); margin-top: 1px; }
  .list-actions { display: flex; gap: 6px; }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: 80px; right: 20px; z-index: 200;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--rose-dark), var(--rose));
    color: white; font-size: 1.5rem; border: none; cursor: pointer;
    box-shadow: 0 4px 20px rgba(139,74,74,0.5); display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .fab:hover { transform: scale(1.08); }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(42,31,31,0.55);
    z-index: 300; align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--white); border-radius: 24px 24px 0 0; padding: 24px 20px 40px;
    width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: var(--rose-light); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; color: var(--rose-dark); margin-bottom: 18px; }

  /* ── STATS ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--white); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); text-align: center; }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--rose-dark); line-height: 1; }
  .stat-label { font-size: 0.72rem; color: var(--mid); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── SERVIÇOS ── */
  .service-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--light); }
  .service-row:last-child { border-bottom: none; }
  .service-name { font-size: 0.88rem; font-weight: 500; }
  .service-meta { font-size: 0.75rem; color: var(--mid); margin-top: 1px; }
  .service-price { font-size: 0.85rem; font-weight: 600; color: var(--gold); text-align: right; }
  .service-price small { display: block; font-size: 0.68rem; color: var(--mid); font-weight: 400; }

  /* ── LOGIN ── */
  #login-page {
    position: fixed; inset: 0; z-index: 500; background: linear-gradient(160deg, var(--dark) 0%, var(--rose-dark) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px;
  }
  .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 700; color: white; text-align: center; margin-bottom: 6px; }
  .login-sub { font-size: 0.8rem; color: rgba(255,255,255,0.6); text-align: center; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 40px; }
  .login-card { background: white; border-radius: 24px; padding: 28px 22px; width: 100%; max-width: 360px; }
  .login-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--rose-dark); margin-bottom: 20px; font-weight: 600; }
  .prof-select-grid { display: grid; gap: 10px; margin-bottom: 20px; }
  .prof-option {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 2px solid var(--rose-light); border-radius: 14px; cursor: pointer; transition: all 0.2s;
  }
  .prof-option:hover, .prof-option.selected { border-color: var(--rose-dark); background: var(--light); }
  .prof-option .po-name { font-weight: 600; font-size: 0.9rem; }
  .prof-option .po-role { font-size: 0.72rem; color: var(--mid); margin-top: 1px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--mid); }
  .empty-state .es-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.85rem; }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--dark); color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 0.82rem; z-index: 999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* colunas por profissional */
  .cols-wrap { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .col-prof { border-radius: 12px; overflow: hidden; background: var(--cream); }
  .col-header { padding: 10px; display: flex; align-items: center; gap: 6px; }
  .col-header.rose { background: linear-gradient(135deg, var(--rose-dark), var(--rose)); color: white; }
  .col-header.gold { background: linear-gradient(135deg, #8a6020, var(--gold)); color: white; }
  .col-header.green { background: linear-gradient(135deg, #2e7d32, #66bb6a); color: white; }
  .col-hname { font-weight: 600; font-size: 0.82rem; }
  .col-hcount { font-size: 0.7rem; opacity: 0.85; margin-left: auto; }
  .col-body { padding: 8px; min-height: 60px; }
  .col-empty { text-align: center; padding: 16px 8px; color: var(--mid); font-size: 0.73rem; }
  .appt-hora { font-size: 0.68rem; font-weight: 700; color: var(--rose-dark); margin-bottom: 2px; }

  .prof-tab-wrap { display: grid; grid-template-columns: repeat(3,1fr); position: sticky; top: 130px; z-index: 80; box-shadow: 0 2px 8px rgba(42,31,31,0.2); overflow: hidden; }
  .prof-tab { padding: 16px 8px; text-align: center; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: white; opacity: 0.6; transition: opacity 0.2s; letter-spacing: 0.02em; }
  .prof-tab.active { opacity: 1; box-shadow: inset 0 -4px 0 rgba(255,255,255,0.6); }
  .pt-rose { background: var(--rose-dark); }
  .pt-gold { background: #8a6020; }
  .pt-green { background: #2e7d32; }
  .grade-table { width: 100%; border-collapse: collapse; }
  .grade-table tr { border-bottom: 1px solid var(--rose-light); }
  .hora-td { width: 48px; font-size: 0.68rem; color: var(--mid); font-weight: 600; text-align: right; padding: 0 8px; height: 34px; background: var(--cream); border-right: 2px solid var(--rose-light); white-space: nowrap; }
  .slot-td { height: 34px; padding: 3px 8px; cursor: pointer; vertical-align: middle; }
  .slot-td:hover { background: var(--light); }
  .slot-td.tem-appt { background: var(--rose-light); }
  .slot-nome { font-size: 0.78rem; font-weight: 600; color: var(--dark); }
  .slot-svc { font-size: 0.68rem; color: var(--mid); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">

    <div class="prof-option" id="po-2" onclick="selectProf(2)">

    <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar →</button>

    <span class="nav-icon">✨</span>Serviços

<!-- ═══════════ AGENDA ═══════════ -->

<script>
// ═══════════ DADOS ═══════════
const FUNCIONARIOS = [
  { id: 1, nome: 'Elly', cor: 'av-rose', emoji: '👑', role: 'Proprietária & Especialista' },
  { id: 2, nome: 'Denny', cor: 'av-gold', emoji: '✂️', role: 'Especialista em Cabelos' },
  { id: 3, nome: 'Lanna', cor: 'av-green', emoji: '💅', role: 'Especialista em Beleza' },
];

// LocalStorage
const DB_URL = "https://studio-elly-default-rtdb.firebaseio.com";
let agendamentos = [];
let syncInterval = null;

async function loadFromFirebase() {
  try {
    const res = await fetch(DB_URL + "/agendamentos.json");
    const data = await res.json();
    let novos = [];
    if (data) {
      if (Array.isArray(data)) {
        // é array de arrays ou array de objetos
        data.forEach(item => {
          if (Array.isArray(item)) {
            item.forEach(a => { if (a && a.id) novos.push(a); });
          } else if (item && item.id) {
            novos.push(item);
          }
        });
      } else if (typeof data === 'object') {
        Object.values(data).forEach(item => {
          if (Array.isArray(item)) {
            item.forEach(a => { if (a && a.id) novos.push(a); });
          } else if (item && item.id) {
            novos.push(item);
          }
        });
      }
    }
    agendamentos = novos;
    if (currentUser) {
      renderWeek();
      setTimeout(function(){ renderTimeline(); }, 100);
      updateStats();
    }
  } catch(e) { console.log('Sync error', e); }
}

async function save(id, val) {
  await fetch(DB_URL + "/agendamentos/" + id + ".json", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(val)
  });
  await loadFromFirebase();
}

function startSync() {
  loadFromFirebase();
  syncInterval = setInterval(loadFromFirebase, 5000);
  setInterval(checkLembretes, 60000);
  setTimeout(checkLembretes, 3000);
}

function isMicropig(servicoId) { return IDS_MICROPIG.includes(servicoId); }

function waLink(fone, msg) {
  return `https://wa.me/55${fone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
}

function checkLembretes() {
  const now = new Date();
  agendamentos.forEach(a => {
    if (a.status === 'cancelado' || !a.fone || !isMicropig(a.servicoId)) return;
    const apptDateTime = new Date(a.data + 'T' + a.hora + ':00');
    const diffHrs = (apptDateTime - now) / (1000 * 60 * 60);
    const lembretes = a.lembretes || {};
    if (diffHrs <= 24 && diffHrs > 23 && !lembretes.h24) {
      window.open(waLink(a.fone, msgLembrete24h(a)), '_blank');
      a.lembretes = { ...lembretes, h24: true };
      save('elly_agendamentos', agendamentos);
      showToast('📲 Lembrete 24h enviado para ' + a.nomeCliente);
    }
    if (diffHrs <= 2 && diffHrs > 1.83 && !lembretes.h2) {
      window.open(waLink(a.fone, msgLembrete2h(a)), '_blank');
      a.lembretes = { ...lembretes, h2: true };
      save('elly_agendamentos', agendamentos);
      showToast('📲 Lembrete 2h enviado para ' + a.nomeCliente);
    }
  });
}

// ═══════════ AGENDA ═══════════
function renderWeek() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // find Monday of current week
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - dow + 1);

  document.getElementById('month-label').textContent = months[now.getMonth()] + ' ' + now.getFullYear();

  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const ds = d.toISOString().split('T')[0];
    const hasEvent = agendamentos.some(a => a.data === ds && a.status !== 'cancelado');
    const sel = ds === selectedDate ? 'selected' : '';
    const hasClass = hasEvent ? 'has-event' : '';
    html += `<div class="day-chip ${sel} ${hasClass}" onclick="selectDay('${ds}')">
      <div class="dc-name">${days[d.getDay()]}</div>
      <div class="dc-num">${d.getDate()}</div>
      <div class="dc-dot"></div>
    </div>`;
  }
  document.getElementById('week-scroll').innerHTML = html;
}

function selectDay(ds) {
  selectedDate = ds;
  renderWeek();
  renderTimeline();
}

function moveWeek(dir) {
  weekOffset += dir;
  renderWeek();
  renderTimeline();
}

function renderProfTabs() {
  var el = document.getElementById('prof-tab-wrap');
  if (!el) return;
  var colors = ['pt-rose','pt-gold','pt-green'];
  var tabs = '';
  for (var i = 0; i < FUNCIONARIOS.length; i++) {
    var f = FUNCIONARIOS[i];
    var active = f.id === activeProfId ? 'active' : '';
    tabs += '<div class="prof-tab ' + colors[i] + ' ' + active + '" onclick="trocarProf(' + f.id + ')">' + f.nome + '</div>';
  }
  el.innerHTML = tabs;
}

function trocarProf(id) {
  activeProfId = id;
  renderTimeline();
}

function renderTimeline() {
  renderProfTabs();
  var dayAppts = [];
  for (var i = 0; i < agendamentos.length; i++) {
    var a = agendamentos[i];
    if (a.data === selectedDate && a.status !== 'cancelado' && a.profId === activeProfId) {
      dayAppts.push(a);
    }
  }
  var apptMap = {};
  for (var i = 0; i < dayAppts.length; i++) {
    apptMap[dayAppts[i].hora] = dayAppts[i];
  }
  var slots = [];
  for (var h = 9; h < 20; h++) {
    var mins = ['00','15','30','45'];
    for (var m = 0; m < mins.length; m++) {
      slots.push((h < 10 ? '0' : '') + h + ':' + mins[m]);
    }
  }
  slots.push('20:00');
  var rows = '';
  for (var s = 0; s < slots.length; s++) {
    var slot = slots[s];
    var appt = apptMap[slot];
    rows += '<tr><td class="hora-td">' + slot + '</td>';
    if (appt) {
      var svc = null;
      for (var x = 0; x < SERVICOS.length; x++) {
        if (SERVICOS[x].id === appt.servicoId) { svc = SERVICOS[x]; break; }
      }
      rows += '<td class="slot-td tem-appt" onclick="verAgendamento(' + appt.id + ')"><div class="slot-nome">' + appt.nomeCliente + '</div><div class="slot-svc">' + (svc ? svc.nome : '') + '</div></td>';
    } else {
      rows += '<td class="slot-td" onclick="abrirSlot(' + JSON.stringify(slot) + ')"></td>';
    }
    rows += '</tr>';
  }
  var tel = document.getElementById('timeline');
  if (tel) tel.innerHTML = '<table class="grade-table"><tbody>' + rows + '</tbody></table>';
}

function cancelarAgendamento() {
  if (!viewingApptId) return;
  const idx = agendamentos.findIndex(a => a.id === viewingApptId);
  if (idx >= 0) { agendamentos[idx].status = 'cancelado'; save('elly_agendamentos', agendamentos); }
  closeModal('modal-ver-agendamento');
  renderTimeline();
  renderWeek();
  updateStats();
  showToast('Agendamento cancelado');
}

function salvarAgendamento() {
  const nomeCliente = document.getElementById('na-cliente').value.trim();
  const fone = document.getElementById('na-fone').value.trim();
  const servicoId = parseInt(document.getElementById('na-servico').value);
  const profId = parseInt(document.getElementById('na-profissional').value);
  const data = document.getElementById('na-data').value;
  const hora = document.getElementById('na-hora').value;
  const obs = document.getElementById('na-obs').value;

  if (!nomeCliente || !servicoId || !profId || !data || !hora) {
    showToast('Preencha todos os campos'); return;
  }

  const novo = { id: Date.now(), nomeCliente, fone, servicoId, profId, data, hora, obs, status: 'confirmado' };
  agendamentos.push(novo);
  save('elly_agendamentos', agendamentos);
  closeModal('modal-novo-agendamento');
  selectedDate = data;
  renderWeek();
  renderTimeline();
  updateStats();
  showToast('✅ Agendamento confirmado!');
}

    const hoje = agendamentos.filter(a => a.profId === f.id && a.data === today() && a.status !== 'cancelado').length;
    return `<div class="list-item">
      <div class="avatar ${f.cor}">${f.emoji}</div>
      <div class="list-info">

      </div>
    </div>`;
  }).join('');
}

function updateStats() {
  const hoje = agendamentos.filter(a => a.data === today() && a.status !== 'cancelado').length;
  const now = new Date();
  const dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - dow + 1);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const semana = agendamentos.filter(a => {
    const d = new Date(a.data);
    return d >= mon && d <= sun && a.status !== 'cancelado';
  }).length;
  document.getElementById('stat-hoje').textContent = hoje;
  document.getElementById('stat-semana').textContent = semana;
}

  const cats = [...new Set(SERVICOS.map(s => s.cat))];
  let html = '';
  cats.forEach(cat => {
    const svcs = SERVICOS.filter(s => s.cat === cat);
    html += `<div style="margin-bottom:4px"><div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--rose-dark);font-weight:600;padding:8px 0 4px">${cat}</div>`;

      const profs = s.profissionais.map(id => FUNCIONARIOS.find(f=>f.id===id)?.nome).join(', ');
      html += `<div class="service-row">
        <div>
          <div class="service-name">${s.nome}</div>
          <div class="service-meta">⏱ ${s.duracao}min · ${profs}</div>
        </div>
        <div class="service-price">
          <span style="color:var(--mid);font-size:0.75rem">A definir</span>
        </div>
      </div>`;
    });
    html += '</div>';

    SERVICOS.map(s => `<option value="${s.id}">${s.nome} (${s.duracao}min)</option>`).join('');

  const selProf = document.getElementById('na-profissional');
  selProf.innerHTML = '<option value="">Selecione a profissional...</option>' +
    FUNCIONARIOS.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
}

function filtrarProfissional() {
  const svcId = parseInt(document.getElementById('na-servico').value);
  const svc = SERVICOS.find(s => s.id === svcId);
  const sel = document.getElementById('na-profissional');
  if (!svc) {
    sel.innerHTML = '<option value="">Selecione a profissional...</option>' +
      FUNCIONARIOS.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
    return;
  }
  sel.innerHTML = '<option value="">Selecione a profissional...</option>' +
    svc.profissionais.map(id => {
      const f = FUNCIONARIOS.find(x => x.id === id);
      return f ? `<option value="${f.id}">${f.nome}</option>` : '';
    }).join('');
  if (svc.profissionais.length === 1) sel.value = svc.profissionais[0];
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'agenda') { renderWeek(); renderTimeline(); }

  if (id === 'funcionarios') { renderFuncionarios(); updateStats(); }
  if (id === 'servicos') renderServicos();
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  if (id === 'modal-novo-agendamento') {
    document.getElementById('na-cliente').value = '';
    document.getElementById('na-fone') && (document.getElementById('na-fone').value = '');
    document.getElementById('na-data').value = selectedDate;
    document.getElementById('na-obs').value = '';
    populateSelects();
  }

}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  viewingApptId = null;
}

// close modal on bg click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

function formatDate(ds) {
  const [y,m,d] = ds.split('-');
  return `${d}/${m}/${y}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
